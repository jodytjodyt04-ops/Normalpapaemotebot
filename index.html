            --bg-secondary: #111111;

            --toggle-active: #000000;
            --button-bg: #000000;
            --button-text: #ffffff;
            --button-hover: #333333;
            --emote-border: #cccccc;

            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --success-color: #059669;

        input, textarea, select { user-select: text !important; -webkit-user-select: text !important; -moz-user-select: text !important; -ms-user-select: text !important; }
        img, a { -webkit-user-drag: none !important; user-drag: none !important; }

        * { margin:0; padding:0; box-sizing:border-box; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        body {

            background-color: var(--bg-primary);
            color: var(--text-primary);

            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;

        ::-webkit-scrollbar { width:8px; }
        ::-webkit-scrollbar-track { background:var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background:var(--scrollbar-thumb); border-radius:4px; }

        .container {
            max-width: 920px;
            margin: 0 auto;
            background-color: var(--bg-secondary);
            border-radius: 20px;
            padding: 30px 35px 40px;
            box-shadow: 0 20px 60px var(--shadow-color);
            border: 1px solid var(--border-color);
        }

        /* ===== MAIN CONTENT (Always Visible) ===== */
        #main-content { display: block; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            z-index: 99999;
            animation: slideUp 0.4s ease;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .toast-info { background: var(--gradient-start); color: #fff; }
        .toast-success { background: var(--success-color); color: #fff; }
        .toast-error { background: var(--error-color); color: #fff; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 16px;
        }
        header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; color: var(--text-primary); }
        .header-controls { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }

        .theme-toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .theme-toggle-wrapper .toggle-label {
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
            flex-shrink: 0;
        }
        .switch input { opacity:0; width:0; height:0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top:0; left:0; right:0; bottom:0;
            background-color: var(--toggle-bg);
            border-radius: 26px;
            transition: 0.3s;
            border: 1px solid var(--border-color);
        }
        .slider::before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--bg-primary);
            border-radius: 50%;
            transition: 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .switch input:checked+.slider { background-color: var(--toggle-active); }
        .switch input:checked+.slider::before { transform: translateX(22px); }
        .switch .slider .icon-wrap {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            pointer-events: none;
            z-index:1;
        }
        .switch .slider .icon-wrap.left { left:6px; color:#ffffff; opacity:0.5; }
        .switch .slider .icon-wrap.right { right:6px; color:#000000; opacity:0.3; }
        .switch input:checked+.slider .icon-wrap.left { opacity:0.3; }
        .switch input:checked+.slider .icon-wrap.right { opacity:0.6; }

        .social-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }
        .social-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            background-color: var(--social-btn-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            transition: 0.25s;
        }
        .social-button:hover {
            background-color: var(--social-btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px var(--shadow-color);
        }
        .social-button.instagram i { color: #E4405F; }
        .social-button.telegram i { color: #26A5E4; }
        .social-button.whatsapp i { color: #25D366; }

        .input-section {

            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;

        .input-group label i { width:18px; color:var(--text-muted); }
        .input-group select,

            border: 1px solid var(--border-color);
            background-color: var(--bg-input);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: 0.25s;
            width: 100%;

        .input-group select:focus,

            box-shadow: 0 0 0 3px rgba(255,255,255,0.06);

        .input-group select option { background-color: var(--bg-secondary); color: var(--text-primary); }
        .uid-grid {

            gap: 12px;
            margin-top: 18px;

            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            background-color: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--emote-border);
            transition: 0.25s;

        .emote-item:hover {
            border-color: var(--text-muted);
            box-shadow: 0 4px 16px var(--shadow-color);
        }
        .emote-item img {

            height: 52px;
            object-fit: contain;
            border-radius: 10px;
            background-color: var(--bg-input);
            flex-shrink: 0;
            border: 1px solid var(--border-color);
            padding: 4px;
        }
        .emote-details { flex: 1; min-width: 0; }
        .emote-details .emote-name {

            font-size: 15px;
            color: var(--text-primary);

            border: none;
            background-color: var(--button-bg);
            color: var(--button-text);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            flex-shrink: 0;

        .send-button:hover {

        @media (max-width: 700px) {

            // ============================================================
            // ===== DOM REFS =====
            // ============================================================
            const teamCodeInput = document.getElementById('team-code');
            const uid1 = document.getElementById('uid1');
            const uid2 = document.getElementById('uid2');
            const uid3 = document.getElementById('uid3');
            const uid4 = document.getElementById('uid4');
            const uid5 = document.getElementById('uid5');
            const uid6 = document.getElementById('uid6');
            const serverSelect = document.getElementById('server');
            const emoteListContainer = document.getElementById('emote-list');

            // ============================================================
            // ===== SEND HANDLER (Uses New API) =====
            // ============================================================
            function attachSendListener(button) {
                button.addEventListener('click', function() {
                    const emoteId = this.getAttribute('data-emote-id');
                    const tc = teamCodeInput.value.trim();
                    const uid = uid1.value.trim();
                    const server = serverSelect.value;

                    if (!tc || !uid || !emoteId) {
                        showToast('⚠️ Please fill in Team Code and UID 1', 'error');
                        return;
                    }

                    // Build URL with the new API format
                    let apiUrl = 'https://ffemote.pro/api/join?';
                    apiUrl += 'tc=' + encodeURIComponent(tc);
                    apiUrl += '&emote_id=' + encodeURIComponent(emoteId);
                    apiUrl += '&server=' + encodeURIComponent(server);
                    apiUrl += '&uid1=' + encodeURIComponent(uid);

                    const uid2Val = uid2.value.trim();
                    const uid3Val = uid3.value.trim();
                    const uid4Val = uid4.value.trim();
                    const uid5Val = uid5.value.trim();
                    const uid6Val = uid6.value.trim();

                    if (uid2Val) apiUrl += '&uid2=' + encodeURIComponent(uid2Val);
                    if (uid3Val) apiUrl += '&uid3=' + encodeURIComponent(uid3Val);
                    if (uid4Val) apiUrl += '&uid4=' + encodeURIComponent(uid4Val);
                    if (uid5Val) apiUrl += '&uid5=' + encodeURIComponent(uid5Val);
                    if (uid6Val) apiUrl += '&uid6=' + encodeURIComponent(uid6Val);

                    showToast('🔄 Sending emote...', 'info');

                    fetch(apiUrl, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    })
                    .then(async function(response) {
                        let data;
                        let isJson = false;
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            try {
                                data = await response.json();
                                isJson = true;
                            } catch (e) {
                                data = await response.text();
                            }
                        } else {
                            data = await response.text();
                        }

                        if (!response.ok) {
                            let errorMsg = '❌ Error ' + response.status;
                            if (response.status === 404) {
                                errorMsg += ' - API endpoint not found.';
                            } else {
                                errorMsg += '\n' + (isJson ? JSON.stringify(data, null, 2) : data);
                            }
                            showToast(errorMsg, 'error');
                            return;
                        }

                        if (isJson) {
                            if (data.status === 'success') {
                                showToast('✅ ' + (data.message || 'Emote sent successfully!'), 'success');
                            } else {
                                showToast('⚠️ ' + (data.message || 'Something went wrong'), 'error');
                            }
                        } else {
                            showToast('✅ Emote sent!', 'success');
                        }
                    })
                    .catch(function(err) {
                        showToast('❌ Network error: ' + err.message, 'error');
                    });
                });
            }

            // ============================================================
            // ===== RENDER EMOTES =====
            // ============================================================
            function renderEmotes() {
                emoteListContainer.innerHTML = '';
                emotes.forEach(function(emote) {
                    const item = document.createElement('div');
                    item.className = 'emote-item';

                    const img = document.createElement('img');
                    const imageUrl = 'https://cdn.jsdelivr.net/gh/ShahGCreator/icon@main/PNG/' + emote.img;
                    img.src = imageUrl;
                    img.alt = emote.name;
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    img.onerror = function() {
                        this.style.display = 'none';
                        const placeholder = document.createElement('div');
                        placeholder.style.cssText = 'width:52px;height:52px;background:var(--bg-input);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid var(--border-color);';
                        placeholder.textContent = '🎮';
                        this.parentNode.insertBefore(placeholder, this);
                    };

                    const details = document.createElement('div');
                    details.className = 'emote-details';
                    const nameP = document.createElement('p');
                    nameP.className = 'emote-name';
                    nameP.textContent = emote.name || 'Unknown Emote';
                    details.appendChild(nameP);

                    const button = document.createElement('button');
                    button.className = 'send-button';
                    button.setAttribute('data-emote-id', emote.id);
                    button.textContent = 'Send';

                    item.appendChild(img);
                    item.appendChild(details);
                    item.appendChild(button);
                    emoteListContainer.appendChild(item);
                    attachSendListener(button);
                });
            }

            renderEmotes();
            console.log('🔒 KT GAMERZ — Using API: https://ffemote.pro/api/join | 7 Servers');
